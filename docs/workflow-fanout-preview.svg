<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7681"/>
    </marker>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .title { fill: #e6edf3; font-size: 34px; font-weight: 800; }
      .subtitle { fill: #8b949e; font-size: 18px; font-weight: 600; }
      .node-title { fill: #e6edf3; font-size: 20px; font-weight: 800; }
      .node-sub { fill: #8b949e; font-size: 13px; font-weight: 600; }
      .stage { fill: #e6edf3; font-size: 16px; font-weight: 760; }
      .app { fill: #e6edf3; font-size: 21px; font-weight: 850; }
      .label { fill: #8b949e; font-size: 14px; font-weight: 650; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 10; filter: url(#shadow); }
      .box-blue { fill: #0f2235; stroke: #1f6feb; stroke-width: 2; rx: 10; filter: url(#shadow); }
      .box-green { fill: #11261b; stroke: #238636; stroke-width: 2; rx: 10; filter: url(#shadow); }
      .box-review { fill: #1a1f2b; stroke: #bc8cff; stroke-width: 2; rx: 10; filter: url(#shadow); }
      .lane { fill: #0d1117; stroke: #30363d; stroke-width: 2; rx: 14; }
      .chip { fill: #161b22; stroke: #3b434d; stroke-width: 1.5; rx: 8; }
      .chip-current { fill: #0f2235; stroke: #58a6ff; stroke-width: 2; rx: 8; }
      .line { stroke: #58a6ff; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .line-muted { stroke: #6e7681; stroke-width: 2.5; fill: none; marker-end: url(#arrowMuted); }
      .line-join { stroke: #3fb950; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="72" y="72" class="title">多应用动态 Workflow 草图</text>
  <text x="72" y="106" class="subtitle">顶层看 orchestration，Fanout 后按应用泳道并行执行，Join 后做跨应用审查</text>

  <rect x="80" y="160" width="210" height="86" class="box-blue"/>
  <text x="185" y="196" text-anchor="middle" class="node-title">应用 Fanout</text>
  <text x="185" y="224" text-anchor="middle" class="node-sub">按需求边界生成分支</text>


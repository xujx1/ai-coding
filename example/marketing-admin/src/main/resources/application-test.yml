server:
  port: 8081

spring:
  application:
    name: marketing-admin
  datasource:
    url: jdbc:h2:mem:umpmarketingadmin;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ump.marketing.domain.model
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.ump.marketing: INFO
    org.springframework: WARN
